services:
  # =================================================================
  # Nexora AI Backend API & Real-Time Engine
  # =================================================================
  - type: web
    name: nexora-ai-backend
    env: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-ai-db
          property: connectionString
      - key: CLIENT_URL
        sync: false # Set to your frontend domain e.g. https://nexora-ai.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false # Set to your frontend domain e.g. https://nexora-ai.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: VAPI_WEBHOOK_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_PUBLIC_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: "21m00Tcm4TlvDq8ikWAM"

databases:
  # =================================================================
  # PostgreSQL Database
  # =================================================================
  - name: nexora-ai-db
    plan: starter
    databaseName: sales_intelligence
    user: nexora_user
